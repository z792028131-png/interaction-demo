<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="薪酬系统交互原型">
  <title>薪酬系统｜交互原型</title>
  <style>
    :root{
      --brand:#e60000;--brand-soft:#fdebea;--text:#333;--muted:#999;--line:#e7e7e7;
      --page:#f7f7f8;--panel:#fff;--head:#f5f6f7;--stripe:#f8f9fa;--tip:#fff7eb;
      --green:#39a95b;--red:#e60000;--drawer-shadow:0 0 22px rgba(0,0,0,.12)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-width:1280px;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);font-size:14px;background:var(--page)}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    .topbar{height:60px;background:var(--brand);color:#fff;display:flex;align-items:center;position:relative;z-index:5;white-space:nowrap}
    .brand{width:195px;height:60px;display:flex;align-items:center;padding-left:24px;gap:6px;font-size:24px;font-weight:800;font-style:italic;letter-spacing:-1.5px;color:#fff}
    .brand-mark{font-size:26px;letter-spacing:-2px;font-weight:900;transform:skew(-12deg)}
    .brand-home{font-size:20px;font-style:normal;font-weight:400;letter-spacing:-.6px}
    .topnav{height:60px;display:flex;align-items:center;gap:0}
    .topnav-item{height:46px;min-width:70px;padding:0 16px;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600;color:#fff}
    .topnav-item.active:after{content:"";position:absolute;bottom:0;width:8px;height:2px;border-radius:2px;background:#fff}
    .topnav-right{margin-left:auto;margin-right:24px;display:flex;align-items:center;gap:10px}
    .top-action{height:32px;padding:0 13px;border:0;border-radius:6px;background:rgba(255,255,255,.22);color:#fff;font-size:13px;display:flex;align-items:center;gap:6px}
    .top-action:hover{background:rgba(255,255,255,.3)}
    .top-action .mini{font-size:15px;line-height:1}
    .layout{height:calc(100vh - 60px);min-height:760px;padding:20px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;overflow:hidden}
    .sidebar,.workspace{background:var(--panel);border-radius:12px;min-height:0}
    .sidebar{padding:16px 10px;overflow:auto}
    .nav-row{width:100%;height:54px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;text-align:left;padding:0 12px;gap:10px;color:#444;font-size:15px;font-weight:600;margin-bottom:8px}
    .nav-row:hover{background:#F6F7F8}
    .nav-row.active{background:#fff;color:#333}
    .nav-row.active:hover{background:#F6F7F8;color:#333}
    .nav-ico{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#999;font-size:18px;flex:0 0 22px}
    .nav-ico img{display:block;width:22px;height:22px}
    .nav-chevron{margin-left:auto;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px}
    .nav-chevron img{display:block;width:16px;height:16px}
    .subnav{display:grid;gap:6px;margin:0 0 10px 0}
    .subnav button{height:52px;padding:0 12px 0 44px;border:0;background:transparent;text-align:left;border-radius:8px;color:#666;font-size:15px}
    .subnav button:hover{background:#f8f8f8;color:#333}
    .subnav button.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
    .workspace{padding:20px;overflow:auto;position:relative}
    .page-content{min-width:0;min-height:100%;display:flex;flex-direction:column}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:32px;margin-bottom:20px}
    .searchbox{width:250px;height:32px;border:1px solid #dedede;border-radius:6px;display:flex;align-items:center;background:#fff;overflow:hidden}
    .searchbox input{width:100%;height:100%;border:0;outline:0;padding:0 12px;font-size:13px}
    .search-ico{width:34px;height:100%;flex:0 0 34px;display:flex;align-items:center;justify-content:center}
    .search-ico img{display:block;width:14px;height:14px}
    .filter-wrap{position:relative;display:inline-flex}
    .filter-chip{height:32px;max-width:300px;border:0;border-radius:6px;background:#f5f6f7;color:#333;padding:0 8px 0 10px;display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;text-align:left}
    .filter-chip:hover,.filter-chip.open{background:#fdebe8;color:#e60000}
    .filter-chip.has-selection{width:auto;background:#fdebe8;color:#333}
    .filter-chip.has-selection:hover,.filter-chip.has-selection.open{color:#e60000}
    .filter-chip .filter-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .filter-chip.has-selection .filter-label{flex:0 1 auto}
    .filter-chip .caret{width:12px;height:12px;flex:0 0 12px;display:inline-flex;align-items:center;justify-content:center;line-height:1;transition:transform .15s}
    .filter-chip .caret img{display:block;width:12px;height:12px}
    .filter-chip .state-active{display:none!important}
    .filter-chip:hover .state-default,.filter-chip.open .state-default,.filter-chip:active .state-default{display:none!important}
    .filter-chip:hover .state-active,.filter-chip.open .state-active,.filter-chip:active .state-active{display:block!important}
    .filter-chip.open .caret{transform:rotate(180deg)}
    .filter-sep{height:18px;width:1px;background:#e5e5e5;flex:0 0 1px}
    .filter-clear{display:inline-flex;align-items:center;justify-content:center;flex:0 0 14px;width:14px;height:14px;line-height:0;cursor:pointer}
    .filter-clear img{display:block;width:14px;height:14px}
    .filter-chip.has-selection .selected-clear{display:none;width:14px;height:14px}
    .filter-chip.has-selection:hover .selected-clear{display:inline-flex}
    .filter-chip.has-selection:hover .caret,.filter-chip.has-selection.open .selected-clear{display:none}
    .filter-chip.has-selection.open .caret{display:inline-flex}
    .filter-menu{position:absolute;top:37px;left:0;z-index:15;min-width:180px;max-height:310px;overflow:auto;padding:6px;background:#fff;border:1px solid #ececec;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .filter-options-menu{width:392px;max-width:calc(100vw - 32px);max-height:310px;display:flex;flex-direction:column;overflow:hidden;padding:0;border-color:#e3e4e5}
    .filter-menu-search{flex:0 0 auto;padding:8px 12px;background:#fff}
    .filter-menu-search-control{height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;border:1px solid #e3e4e5;border-radius:6px;background:#fff}
    .filter-menu-search-control:focus-within{border-color:#e60000}
    .filter-menu-search-input{width:100%;min-width:0;height:100%;padding:0;border:0;outline:0;background:transparent;color:#333;font-family:inherit;font-size:13px;font-weight:400;line-height:20px}
    .filter-menu-search-input::placeholder{color:#999;opacity:1}
    .filter-menu-search-input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
    .filter-menu-search-icon{display:block;width:14px;height:14px;flex:0 0 14px}
    .filter-options-scroll{flex:1;min-height:0;overflow:auto;padding:0 6px 6px}
    .filter-options-empty{padding:14px 8px;text-align:center;color:#999;font-size:13px;line-height:20px}
    .filter-options-menu .filter-option[hidden]{display:none}
    .filter-text-menu{width:320px;max-height:none;padding:10px}
    .filter-text-menu .filter-menu-search{padding:0}
    .filter-date-menu{left:auto;right:0;transform:none;width:568px;max-width:calc(100vw - 32px);max-height:none;overflow:visible;padding:14px 16px}
    .filter-calendar-nav{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;align-items:center;gap:8px;margin-bottom:10px}
    .filter-calendar-nav-button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:#fff;color:#666;font-size:20px;line-height:1}
    .filter-calendar-nav-button:hover{background:#f5f6f7;color:#e60000}
    .filter-calendar-month-titles,.filter-calendar-months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
    .filter-calendar-month-titles{align-items:center;text-align:center;color:#333;font-size:14px;font-weight:600;line-height:24px}
    .filter-calendar-weekdays,.filter-calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
    .filter-calendar-weekdays{margin-bottom:4px;color:#999;text-align:center;font-size:12px;line-height:28px}
    .filter-calendar-day{position:relative;width:32px;height:32px;justify-self:center;border:0;border-radius:50%;background:transparent;color:#333;font-size:13px;line-height:32px;text-align:center}
    .filter-calendar-day:hover{background:#f5f6f7}
    .filter-calendar-day.outside{color:#c8c8c8}
    .filter-calendar-day.in-range{border-radius:0;background:#fdebe8;color:#e60000}
    .filter-calendar-day.range-start,.filter-calendar-day.range-end,.filter-calendar-day.range-start.range-end{border-radius:50%;background:#e60000;color:#fff}
    .filter-calendar-day.today:not(.range-start):not(.range-end)::after{position:absolute;right:5px;bottom:4px;width:3px;height:3px;border-radius:50%;background:#e60000;content:""}
    .filter-calendar-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0;color:#666;font-size:12px;line-height:20px}
    .filter-calendar-range{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .filter-calendar-clear{flex:0 0 auto;border:0;background:transparent;color:#e60000;font-size:12px}
    .filter-menu .filter-option{display:flex;align-items:center;gap:8px;width:100%;height:32px;border:0;background:#fff;text-align:left;padding:0 9px;border-radius:5px;font-size:13px;white-space:nowrap;color:#333}
    .filter-menu .filter-option:hover{background:#f5f5f5}
    .filter-check{width:14px;height:14px;border:1px solid #c8c8c8;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;line-height:1;flex:0 0 14px}
    .filter-option.checked .filter-check{border-color:#e60000;background:#e60000}
    .btn{height:32px;padding:0 14px;border:1px solid #dedede;background:#fff;border-radius:6px;color:#444;font-size:13px;white-space:nowrap}
    .btn:hover{border-color:#bbb;background:#fafafa}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn.primary:hover{background:#d60000}
    .btn.ghost-red{border-color:#f0b8b8;color:var(--brand);background:#fff}
    .btn.small{height:28px;padding:0 10px}
    .btn[disabled]{color:#c8c8c8;background:#f7f7f7;border-color:#e5e5e5;cursor:not-allowed}
    .toolbar-spacer{flex:1}
    .toolbar-query-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap}
    .section-title{height:32px;display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:600}
    .section-title:before{content:"";width:4px;height:14px;background:var(--brand);border-radius:1px}
    .section-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
    .section-actions .btn{font-weight:400}
    .section-actions-divider{width:1px;height:18px;background:var(--line);margin:0 4px;flex:0 0 1px}
    .table-wrap{width:100%;overflow:auto;border-radius:6px 6px 0 0}
    table{width:100%;border-collapse:separate;border-spacing:0;table-layout:auto;font-size:14px;white-space:nowrap}
    thead th{height:40px;background:var(--head);font-weight:500;color:#555;padding:0 12px;text-align:center}
    thead th:first-child{border-radius:6px 0 0 0}
    thead th:last-child{border-radius:0 6px 0 0}
    tbody td{height:40px;padding:0 12px;text-align:center;border-bottom:0;max-width:280px;overflow:hidden;text-overflow:ellipsis}
    tbody tr:nth-child(even){background:var(--stripe)}
    tbody tr:hover{background:#fff5f4}
    .link-red{border:0;background:transparent;color:var(--brand);padding:0 4px;font-size:14px}
    .link-red:hover{text-decoration:none}
    .status{display:inline-flex;align-items:center;gap:6px}
    .status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
    .status.off:before{background:var(--brand)}
    .status.pending:before{background:#f29b38}
    .ellipsis{max-width:220px;display:inline-block;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
    .tag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;background:#e8f6ec;color:#349e4d;font-size:12px;line-height:18px}
    .tag.orange{background:#fff1e8;color:#e87824}
    .tag.gray{background:#f0f0f0;color:#777}
    .pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px 0 4px;color:#666;font-size:13px}
    .page-num{width:24px;height:24px;border:1px solid #e3e3e3;border-radius:4px;background:#fff;text-align:center;padding:0;font-size:13px}
    .page-num.current{border-color:var(--brand);color:var(--brand)}
    .page-go{width:54px;height:24px;border:1px solid #e3e3e3;border-radius:4px;background:#fff}
    .page-size{height:24px;border:1px solid #e3e3e3;border-radius:4px;background:#fff;padding:0 5px;font-size:12px}
    .warning-banner{height:40px;padding:0 16px;background:#fff7eb;border-radius:6px;display:flex;align-items:center;gap:8px;color:#555;margin-bottom:20px;font-size:14px}
    .warning-icon{width:16px;height:16px;border-radius:50%;background:#fa7a19;color:white;text-align:center;font-size:12px;line-height:16px;font-weight:700}
    .warning-banner strong{color:#F97316;font-weight:600}
    .warning-banner button{border:0;background:transparent;color:#e8751a;padding:0;font-size:14px}
    .group-head td{background:#f5f6f7!important;font-weight:600;text-align:left!important;height:40px}
    .group-head.stripe-white td{background:#fff!important}
    .group-head.stripe-gray td{background:var(--stripe)!important}
    .group-head.expanded td{border-bottom:1px solid var(--line)}
    .group-head:hover td{background:#fff5f4!important}
    tbody tr.group-member.stripe-white{background:#fff}
    tbody tr.group-member.stripe-gray{background:var(--stripe)}
    tbody tr.group-member:hover{background:#fff5f4}
    .group-head .group-name{display:inline-flex;align-items:center;gap:10px}
    .group-expand{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex:0 0 16px;border:0;background:transparent;padding:0}
    .group-expand img{display:block;width:12px;height:12px}
    .group-count{font-size:12px;font-weight:400;color:#888}
    .group-control{color:#888;border:0;background:transparent;padding:0 3px;font-size:14px}
    .group-control img{display:block;width:14px;height:14px}
    .group-control:hover{color:var(--brand)}
    .table-gear{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;cursor:pointer}
    .table-gear img{display:block;width:18px;height:18px}
    .empty-note{padding:36px;color:#999;text-align:center}
    .back-row{display:flex;align-items:center;margin-bottom:12px}
    .back-button{border:0;background:#f6f6f6;border-radius:4px;color:#666;padding:4px 8px;font-size:13px}
    .detail-header{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:14px}
    .detail-title{font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .detail-sub{color:#999;font-size:13px}
    .detail-badge{background:#f2f4f6;padding:2px 7px;border-radius:4px;font-size:12px;color:#666;font-weight:400}
    .content-card{background:#fff;border-radius:12px;padding:16px;min-height:calc(100vh - 240px)}
    .weekly-page{height:calc(100vh - 60px);padding:20px;background:#f9f9f9;overflow:auto}
    .weekly-detail-stack{height:100%;min-height:0;display:flex;flex-direction:column;gap:16px}
    .weekly-summary-card{flex:0 0 auto;padding:20px;background:#fff;border-radius:12px}
    .weekly-summary-copy{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
    .weekly-title-row{display:flex;align-items:center;gap:6px;min-height:20px}
    .weekly-title{font-size:18px;font-weight:500;line-height:22px;color:#333;white-space:nowrap}
    .weekly-meta-badge{display:inline-flex;align-items:center;gap:3px;padding:0 6px 0 4px;background:#f2f2f2;border-radius:4px;color:#333;font-size:13px;line-height:20px;white-space:nowrap}
    .weekly-meta-icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px}
    .weekly-meta-icon img{display:block;width:16px;height:16px}
    .weekly-summary-org{font-size:14px;line-height:20px;color:#666;white-space:nowrap}
    .weekly-table-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:20px;background:#fff;border-radius:12px}
    .weekly-card-header{height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:space-between}
    .weekly-card-title{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500;line-height:20px;color:#333}
    .weekly-card-title:before{content:"";width:4px;height:12px;background:var(--brand);border-radius:1px}
    .weekly-year-select{display:inline-flex;width:max-content;min-width:0;height:32px;padding:0;border:0;border-radius:6px;background:#f5f6f7;color:#333;font-size:13px;outline:0;flex:0 0 auto}
    .weekly-table-content{width:100%;display:flex;flex-direction:column;gap:16px}
    .weekly-table-wrap{width:100%;border:1px solid #e5e5e5;border-radius:6px;overflow:hidden}
    .weekly-table{width:100%;table-layout:fixed}
    .weekly-table thead th{height:40px;padding:0 12px;background:#f5f6f7;color:#333;font-size:14px;font-weight:400;text-align:center}
    .weekly-table tbody tr:nth-child(even){background:#fff}
    .weekly-table tbody td{height:40px;padding:0 12px;border-bottom:1px solid #e3e4e5;color:#333;font-size:14px;text-align:center}
    .weekly-table tbody tr:last-child td{border-bottom:0}
    .muted{color:#999}
    .overlay{position:fixed;inset:60px 0 0;padding:12px 20px 12px 0;background:rgba(0,0,0,.22);z-index:20;display:flex;justify-content:flex-end}
    .drawer{height:100%;width:800px;max-width:calc(100vw - 260px);background:#fff;border-radius:12px;box-shadow:var(--drawer-shadow);position:relative;display:flex;flex-direction:column;overflow:hidden}
    .drawer.wide-form{width:800px;max-width:calc(100vw - 280px)}
    .drawer.wide{width:800px;max-width:calc(100vw - 280px)}
    .drawer-header{height:56px;flex:0 0 56px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid transparent;font-weight:600}
    .drawer-header:before{content:"";width:4px;height:14px;background:var(--brand);margin-right:8px}
    .drawer-close{margin-left:auto;width:28px;height:28px;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 28px}.drawer-close img{display:block;width:28px;height:28px}
    .drawer-body{padding:0 18px 76px;overflow:auto;flex:1}
    .drawer-footer{position:absolute;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:0;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 18px}
    .drawer-footer .btn{height:36px;min-width:166px}
    .drawer-footer .btn.primary{min-width:166px}
    .drawer-title-dot{color:var(--brand);font-size:18px;margin-right:8px}
    .field{margin-bottom:15px;min-width:0}
    .field-label{display:block;margin-bottom:7px;font-size:13px;color:#444;line-height:16px}
    .field-label.required:before{content:"*";color:var(--brand);margin-right:2px}
    .control{width:100%;height:32px;border:1px solid #e0e0e0;border-radius:6px;background:#fff;padding:0 11px;outline:0;font-size:13px}
    .control:focus,.textarea:focus{border-color:#e99696;box-shadow:0 0 0 2px rgba(230,0,0,.06)}
    .control:disabled{background:#f5f5f5;color:#999;cursor:not-allowed}
    .control[readonly],.control:disabled{background:#f5f5f5;color:#777;cursor:not-allowed}
    .input-with-action{display:flex;gap:8px;align-items:center}
    .input-with-action .control{flex:1}
    .icon-button{height:32px;width:32px;padding:0;border:1px solid #e0e0e0;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 32px;cursor:pointer}.icon-button img{display:block;width:20px;height:20px}
    .counter{font-size:11px;color:#aaa;margin-left:auto;float:right}
    .textarea{width:100%;min-height:68px;border:1px solid #e0e0e0;border-radius:6px;padding:9px 11px;outline:0;resize:vertical;font-size:13px}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
    .item-sequence-field .control{width:376px}
    .subject-code-fields{display:flex;flex-direction:column;gap:16px}
    .subject-code-fields>.field{margin-bottom:0}
    .subject-form-fields{display:flex;flex-direction:column;gap:16px}
    .subject-form-fields>.field{margin-bottom:0}
    .subject-form-fields>.selection-panel{margin:0}
    .period-form-fields{display:flex;flex-direction:column;gap:16px}
    .period-form-fields .field,.period-form-fields>.period-field-stack{margin:0}
    .period-field-stack{display:flex;flex-direction:column;gap:6px;min-width:0}
    .period-form-fields .field-label{line-height:20px;margin-bottom:6px}

        if(name==='ai-translate'){var chinese=(state.formDraft&&state.formDraft[state.modal.field])||'';var dict={'基本工资':['Basic Salary','เงินเดือนพื้นฐาน','Lương cơ bản','Gaji Asas','الراتب الأساسي'],'固定津贴':['Fixed Allowance','เบี้ยเลี้ยงคงที่','Phụ cấp cố định','Elaun Tetap','بدل ثابت'],'交通津贴':['Transportation Allowance','ค่าเดินทาง','Phụ cấp đi lại','Elaun Pengangkutan','بدل النقل'],'泰国BNT总部薪资组方案':['Thailand BNT Headquarters Salary Group','กลุ่มเงินเดือนสำนักงานใหญ่ BNT ประเทศไทย','Nhóm lương trụ sở BNT Thái Lan','Kumpulan Gaji Ibu Pejabat BNT Thailand','مجموعة رواتب المقر الرئيسي BNT تايلاند'],'泰国BNT自然月':['Thailand BNT Calendar Month','เดือนปฏิทิน BNT ประเทศไทย','Tháng dương lịch BNT Thái Lan','Bulan Kalendar BNT Thailand','الشهر الميلادي لـ BNT تايلاند']};var vals=dict[chinese]||[chinese+' (EN)',chinese+' (TH)',chinese+' (VI)',chinese+' (MS)',chinese+' (AR)'];['en','th','vi','ms','ar'].forEach(function(k,i){state.formDraft.translations[k]=vals[i]});renderApp();setToast('示例译文已填入，可修改后保存');return}
        if(name==='open-org'){state.orgField=el.getAttribute('data-field')||'orgs';state.orgOriginal=(state.formDraft[state.orgField]||[]).slice();state.modal={type:'org'};renderApp();return}

        if(name==='close-modal'||name==='cancel-modal'){closeModal();return}
        if(name==='confirm-modal'){confirmAction();return}
        if(name==='overlay-close'){if(evt&&evt.target===el){if(state.modal)closeModal();else closeDrawer()}return}

      document.addEventListener('click',function(event){var el=event.target.closest('[data-action]');if(state.openFilter&&!event.target.closest('.filter-wrap')){state.filterSearch=state.filterSearch||{};state.filterSearch[state.openFilter]='';state.openFilter='';var openChip=document.querySelector('.filter-chip.open');if(openChip){openChip.classList.remove('open');openChip.setAttribute('aria-expanded','false')}var openMenu=document.querySelector('.filter-menu:not(.select-menu)');if(openMenu)openMenu.remove()}if(state.openSelect&&!event.target.closest('.select-wrap')){state.openSelect='';document.querySelectorAll('.select-trigger.open').forEach(function(trigger){trigger.classList.remove('open');trigger.setAttribute('aria-expanded','false')});document.querySelectorAll('.select-menu').forEach(function(menu){menu.remove()})}if(!el)return;var action=el.getAttribute('data-action');doAction(action,el,event)},true);
      function updateWeekEnd(path,value){var endPath=path==='salaryWeekStart'?'salaryWeekEnd':'attendanceWeekEnd';var endValue=addDateDays(value,6);if(state.formDraft)setPath(state.formDraft,endPath,endValue);var endInput=document.querySelector('[data-bind="'+endPath+'"]');if(endInput)endInput.value=endValue}
      document.addEventListener('input',function(event){var el=event.target;if(el.matches('[data-filter-menu-search]')){var filterKey=el.getAttribute('data-filter-menu-search'),query=el.value.trim().toLocaleLowerCase(),menu=el.closest('.filter-options-menu'),options=menu?menu.querySelectorAll('[data-filter-search-value]'):[],visible=0;state.filterSearch=state.filterSearch||{};state.filterSearch[filterKey]=el.value;options.forEach(function(option){var text=(option.getAttribute('data-filter-search-value')||option.textContent||'').toLocaleLowerCase(),matches=!query||text.indexOf(query)>=0;option.hidden=!matches;if(matches)visible++});var empty=menu&&menu.querySelector('.filter-options-empty');if(empty)empty.hidden=visible>0;return}if(el.matches('[data-filter-text]')){var filterKey=el.getAttribute('data-filter-text');if(el.value.trim())state.filters[filterKey]=el.value;else delete state.filters[filterKey];return}if(el.matches('[data-search]')){state.filters[el.getAttribute('data-search')]=el.value;return}if(el.matches('[data-bind]')){var path=el.getAttribute('data-bind');if(state.formDraft)setPath(state.formDraft,path,el.value);if(path==='salaryWeekStart'||path==='attendanceWeekStart')updateWeekEnd(path,el.value);var languageRow=el.closest('.language-row'),languageDot=languageRow&&languageRow.querySelector('.language-dot');if(languageDot)languageDot.classList.toggle('empty',!el.value.trim());var count=document.querySelector('[data-count="'+CSS.escape(path)+'"]');if(count){var max=count.textContent.split('/')[1]||'';count.textContent=el.value.length+'/'+max}return}if(el.matches('[data-lang]')){if(!state.formDraft.translations)state.formDraft.translations={};state.formDraft.translations[el.getAttribute('data-lang')]=el.value;var row=el.closest('.language-row'),dot=row&&row.querySelector('.language-dot');if(dot)dot.classList.toggle('empty',!el.value.trim());return}if(el.matches('[data-amount]')){state.formDraft.amounts[el.getAttribute('data-amount')]=el.value;return}if(el.matches('[data-correct-amount]')){state.formDraft.amounts[el.getAttribute('data-correct-amount')]=el.value;return}if(el.matches('[data-bind="deleteNote"]')){state.formDraft.deleteNote=el.value}});
      document.addEventListener('change',function(event){var el=event.target;if(el.matches('[data-filter-date]')){var key=el.getAttribute('data-filter-date'),bound=el.getAttribute('data-date-bound'),range=Object.assign({},state.filters[key]||{});if(el.value)range[bound]=el.value;else delete range[bound];if(range.start||range.end)state.filters[key]=range;else delete state.filters[key];return}if(el.matches('[data-bind]')){var path=el.getAttribute('data-bind');if(state.formDraft)setPath(state.formDraft,path,el.value);if(path==='salaryWeekStart'||path==='attendanceWeekStart')updateWeekEnd(path,el.value);if(['scope','cycle','attendance','type','scopeValue'].indexOf(path)>=0)renderApp();return}if(el.matches('[data-org]')){var value=el.getAttribute('data-org');addOrRemoveValue(state.orgField||'orgs',value,el.checked);renderApp();return}if(el.matches('[data-org-all]')){var nodes=Array.prototype.slice.call(document.querySelectorAll('[data-org]'));nodes.forEach(function(n){addOrRemoveValue(state.orgField||'orgs',n.getAttribute('data-org'),el.checked)});renderApp();return}if(el.matches('[data-column]')){var c=el.getAttribute('data-column');var arr=state.formDraft.columns||[];if(el.checked&&arr.indexOf(c)<0)arr.push(c);if(!el.checked)arr=arr.filter(function(x){return x!==c});state.formDraft.columns=arr;renderApp();return}if(el.matches('[data-column-all]')){var all=state.columnOptions.filter(function(c){return ['工号','姓名','基本工资'].indexOf(c)<0});state.formDraft.columns=el.checked?Array.from(new Set((state.formDraft.columns||[]).concat(all))):(state.formDraft.columns||[]).filter(function(c){return ['工号','姓名','基本工资'].indexOf(c)>=0});renderApp();return}if(el.matches('[data-import-item]')){var val=el.getAttribute('data-import-item');var arr=state.formDraft.importItems||[];if(el.checked&&arr.indexOf(val)<0)arr.push(val);if(!el.checked)arr=arr.filter(function(x){return x!==val});state.formDraft.importItems=arr;return}if(el.id==='import-file'&&el.files&&el.files.length){state.formDraft.file=el.files[0].name;renderApp();return}if(el.matches('[data-action="year-select"]')){state.year=Number(el.value);renderApp();return}});
      document.addEventListener('keydown',function(event){if(event.key==='Escape'){if(state.openSelect){state.openSelect='';renderApp();return}if(state.openFilter){state.openFilter='';renderApp();return}if(state.modal)closeModal();else if(state.drawer)closeDrawer()}if(event.key==='Enter'&&event.target.matches('[data-search]')){event.preventDefault();state.openFilter='';state.openSelect='';renderApp()}});
      document.addEventListener('dragstart',function(event){var row=event.target.closest('[data-col-index]');if(row){event.dataTransfer.setData('text/plain',row.getAttribute('data-col-index'));event.dataTransfer.effectAllowed='move'}});
      document.addEventListener('dragover',function(event){if(event.target.closest('[data-col-index]'))event.preventDefault()});
      document.addEventListener('drop',function(event){var target=event.target.closest('[data-col-index]');if(!target)return;event.preventDefault();var from=Number(event.dataTransfer.getData('text/plain'));var to=Number(target.getAttribute('data-col-index'));var arr=state.formDraft&&state.formDraft.columns;if(!arr||from===to)return;var moved=arr.splice(from,1)[0];arr.splice(to,0,moved);state.formDraft.columns=arr;renderApp()});
      document.addEventListener('dragover',function(event){if(event.target.closest('.upload-drop'))event.preventDefault()});
      document.addEventListener('drop',function(event){var zone=event.target.closest('.upload-drop');if(!zone)return;event.preventDefault();var files=event.dataTransfer.files;if(files&&files.length){state.formDraft.file=files[0].name;renderApp()}});
      renderApp();
    })();
